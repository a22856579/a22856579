<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f3">
  <title>案件進度追蹤</title>
  <style>
    :root{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#202c28;background:#f5f6f3;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0}.shell{max-width:1180px;margin:auto;padding:38px 28px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:32px}.brand{display:flex;align-items:center;gap:14px}.mark{width:46px;height:46px;border-radius:15px;background:#1c5b4c;color:#fff;display:grid;place-items:center;font-size:22px}.eyebrow{font-size:12px;color:#73817b;letter-spacing:.08em;margin:0 0 4px}.brand h1{font-size:24px;margin:0;letter-spacing:.02em}.actions{display:flex;gap:10px}.button{border:1px solid #d9e0dc;border-radius:10px;padding:10px 15px;background:#fff;color:#26352f;font:inherit;font-size:14px;cursor:pointer}.button:hover{background:#f1f5f2}.button.primary{background:#1c5b4c;color:white;border-color:#1c5b4c}.button.primary:hover{background:#164b3e}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.stat{background:#fff;border:1px solid #e5e9e6;border-radius:14px;padding:17px 19px}.stat-label{font-size:13px;color:#718079}.stat-num{font-size:27px;font-weight:650;margin-top:8px}.stat-num small{font-size:13px;font-weight:400;color:#829088;margin-left:4px}.toolbar{display:flex;align-items:center;gap:10px;margin:20px 0 14px}.search{position:relative;flex:1}.search input{width:100%;padding:11px 14px 11px 38px;border:1px solid #dfe5e1;border-radius:10px;background:#fff;font:inherit;font-size:14px;outline:none}.search:before{content:'⌕';position:absolute;left:14px;top:6px;font-size:22px;color:#78867f}.search input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:#43816f;box-shadow:0 0 0 3px #43816f1c}.toolbar select{padding:11px 34px 11px 12px;border:1px solid #dfe5e1;border-radius:10px;background:white;color:#33423b;font:inherit;font-size:14px}.list-head{display:flex;justify-content:space-between;color:#7a8881;font-size:13px;margin:18px 2px 10px}.cards{display:grid;gap:10px}.case{background:#fff;border:1px solid #e4e9e5;border-radius:14px;padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) 175px 112px 34px;align-items:center;gap:20px;transition:border .15s}.case:hover{border-color:#b8cbc1}.case-title{font-weight:600;font-size:16px;margin:0 0 6px}.case-sub{font-size:13px;color:#7b8882;display:flex;gap:12px;flex-wrap:wrap}.case-note{font-size:13px;color:#58665f;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:680px}.status{display:inline-flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:#8c9992}.status[data-status="進行中"] .dot{background:#348c70}.status[data-status="待回覆"] .dot{background:#d19a3b}.status[data-status="已完成"] .dot{background:#84918a}.status[data-status="暫停"] .dot{background:#8773ac}.due{font-size:13px;color:#58665f}.due.overdue{color:#bd5145}.row-actions{display:flex;gap:3px}.icon-btn{border:0;background:transparent;color:#75827b;cursor:pointer;border-radius:7px;padding:7px;font:inherit}.icon-btn:hover{background:#f0f3f1;color:#26352f}.empty{padding:54px 20px;text-align:center;background:#fff;border:1px dashed #d8e1db;border-radius:14px;color:#78867f}.empty strong{display:block;color:#3e4b45;margin-bottom:8px;font-size:16px}.hidden{display:none!important}.modal-wrap{position:fixed;inset:0;background:#15231f66;display:grid;place-items:center;padding:20px;z-index:5}.modal{width:min(560px,100%);background:#fff;border-radius:18px;padding:25px;box-shadow:0 20px 70px #17271f33}.modal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-top h2{font-size:19px;margin:0}.close{font-size:23px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;color:#526159}.field input,.field select,.field textarea{border:1px solid #dfe5e1;border-radius:9px;padding:10px 11px;background:#fff;font:inherit;font-size:14px;outline:none}.field textarea{resize:vertical;min-height:88px}.modal-foot{display:flex;justify-content:space-between;align-items:center;margin-top:23px}.modal-foot .right{display:flex;gap:9px}.delete{color:#b14840;border-color:#efd8d5}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#263c33;color:white;padding:11px 17px;border-radius:10px;font-size:14px;box-shadow:0 5px 22px #0002;z-index:8}.footnote{font-size:12px;color:#91a098;margin-top:24px;text-align:center} @media(max-width:720px){.shell{padding:24px 16px 40px}.top{align-items:flex-start}.brand h1{font-size:20px}.actions{flex-direction:column}.actions .button{padding:9px 11px}.stats{grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:14px}.stat-num{font-size:24px}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}.toolbar select{flex:1}.case{grid-template-columns:minmax(0,1fr) auto;gap:9px 14px;padding:15px}.case-meta{grid-column:1}.case-status{grid-column:2;grid-row:1}.due{grid-column:1}.row-actions{grid-column:2;grid-row:3;justify-self:end}.case-note{max-width:100%}.list-head span:last-child{display:none}}@media(max-width:430px){.top{gap:8px}.mark{width:40px;height:40px}.brand{gap:9px}.eyebrow{font-size:10px}.brand h1{font-size:18px}.button{font-size:13px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand"><div class="mark">✓</div><div><p class="eyebrow">CASE MANAGEMENT</p><h1>案件進度追蹤</h1></div></div>
      <div class="actions"><button class="button" id="importBtn">匯入備份</button><button class="button" id="exportBtn">匯出備份</button><button class="button primary" id="addBtn">＋ 新增案件</button></div>
    </header>
    <section class="stats" aria-label="案件統計">
      <div class="stat"><div class="stat-label">全部案件</div><div class="stat-num" id="statAll">0<small>件</small></div></div>
      <div class="stat"><div class="stat-label">進行中</div><div class="stat-num" id="statActive">0<small>件</small></div></div>
      <div class="stat"><div class="stat-label">待回覆</div><div class="stat-num" id="statWaiting">0<small>件</small></div></div>
      <div class="stat"><div class="stat-label">即將到期</div><div class="stat-num" id="statDue">0<small>件</small></div></div>
    </section>
    <section>
      <div class="toolbar"><div class="search"><input id="search" type="search" placeholder="搜尋案件名稱、案號或承辦人…" aria-label="搜尋案件"></div><select id="statusFilter" aria-label="依狀態篩選"><option value="全部">所有狀態</option><option>進行中</option><option>待回覆</option><option>暫停</option><option>已完成</option></select><select id="sortBy" aria-label="排序方式"><option value="updated">最近更新</option><option value="due">期限優先</option><option value="created">建立時間</option></select></div>
      <div class="list-head"><span id="resultCount">案件清單</span><span>點選編輯按鈕可更新案件資訊</span></div>
      <div class="cards" id="cards"></div>
      <div class="empty hidden" id="empty"><strong>還沒有案件</strong>新增第一筆案件，開始記錄進度與期限。</div>
    </section>
    <p class="footnote">資料儲存在目前瀏覽器。定期匯出備份，避免清除瀏覽器資料時遺失。</p>
  </main>
  <div class="modal-wrap hidden" id="modalWrap" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <form class="modal" id="caseForm">
      <div class="modal-top"><h2 id="modalTitle">新增案件</h2><button type="button" class="icon-btn close" id="closeBtn" aria-label="關閉">×</button></div>
      <input type="hidden" id="caseId">
      <div class="form-grid">
        <div class="field full"><label for="title">案件名稱 *</label><input id="title" required maxlength="100" placeholder="例如：○○合約爭議"></div>
        <div class="field"><label for="number">案號</label><input id="number" maxlength="50" placeholder="例如：115年度訴字第…"></div>
        <div class="field"><label for="person">承辦人</label><input id="person" maxlength="40" placeholder="姓名"></div>
        <div class="field"><label for="status">目前狀態</label><select id="status"><option>進行中</option><option>待回覆</option><option>暫停</option><option>已完成</option></select></div>
        <div class="field"><label for="dueDate">下一個期限</label><input id="dueDate" type="date"></div>
        <div class="field full"><label for="note">最新進度／備註</label><textarea id="note" maxlength="1000" placeholder="記錄最近一次處理進度、待辦事項…"></textarea></div>
      </div>
      <div class="modal-foot"><button type="button" class="button delete hidden" id="deleteBtn">刪除案件</button><div class="right"><button type="button" class="button" id="cancelBtn">取消</button><button class="button primary" type="submit">儲存案件</button></div></div>
    </form>
  </div>
  <input type="file" id="fileInput" accept="application/json,.json" class="hidden">
  <div class="toast hidden" id="toast" role="status"></div>
  <script>
    (()=>{
      const KEY='case-tracker-v1', statuses=['進行中','待回覆','暫停','已完成'];
      const $=id=>document.getElementById(id); let cases=load(), toastTimer;
      function load(){try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(data)?data:[]}catch{return []}}
      function save(){localStorage.setItem(KEY,JSON.stringify(cases))}
      function dateText(value){if(!value)return '未設定期限';const d=new Date(value+'T00:00:00');return new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
      function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
      function render(){const q=$('search').value.trim().toLowerCase(), filter=$('statusFilter').value, sort=$('sortBy').value, today=new Date().toISOString().slice(0,10), soon=new Date(Date.now()+7*86400000).toISOString().slice(0,10);
        $('statAll').innerHTML=`${cases.length}<small>件</small>`;$('statActive').innerHTML=`${cases.filter(c=>c.status==='進行中').length}<small>件</small>`;$('statWaiting').innerHTML=`${cases.filter(c=>c.status==='待回覆').length}<small>件</small>`;$('statDue').innerHTML=`${cases.filter(c=>c.dueDate&&c.dueDate>=today&&c.dueDate<=soon&&c.status!=='已完成').length}<small>件</small>`;
        let rows=cases.filter(c=>(filter==='全部'||c.status===filter)&&(!q||[c.title,c.number,c.person,c.note].some(v=>(v||'').toLowerCase().includes(q))));
        rows.sort((a,b)=>sort==='due'?((a.dueDate||'9999').localeCompare(b.dueDate||'9999')):sort==='created'?(b.createdAt||'').localeCompare(a.createdAt||''):(b.updatedAt||'').localeCompare(a.updatedAt||''));
        $('resultCount').textContent=`案件清單・${rows.length} 件`;$('cards').innerHTML=rows.map(c=>{const overdue=c.dueDate&&c.dueDate<today&&c.status!=='已完成';return `<article class="case"><div class="case-main"><h3 class="case-title">${escapeHtml(c.title)}</h3><div class="case-sub">${c.number?`<span>案號 ${escapeHtml(c.number)}</span>`:''}${c.person?`<span>承辦人 ${escapeHtml(c.person)}</span>`:''}</div>${c.note?`<div class="case-note">${escapeHtml(c.note)}</div>`:''}</div><div class="case-status"><span class="status" data-status="${escapeHtml(c.status)}"><i class="dot"></i>${escapeHtml(c.status)}</span></div><div class="due ${overdue?'overdue':''}">${overdue?'已逾期 · ':''}${dateText(c.dueDate)}</div><div class="row-actions"><button class="icon-btn edit" data-id="${escapeHtml(c.id)}" title="編輯案件" aria-label="編輯案件">✎</button></div></article>`}).join('');
        $('empty').classList.toggle('hidden',rows.length!==0);$('cards').classList.toggle('hidden',rows.length===0);
      }
      function openForm(c){$('caseForm').reset();$('caseId').value=c?.id||'';$('modalTitle').textContent=c?'編輯案件':'新增案件';$('deleteBtn').classList.toggle('hidden',!c);if(c){$('title').value=c.title||'';$('number').value=c.number||'';$('person').value=c.person||'';$('status').value=c.status||'進行中';$('dueDate').value=c.dueDate||'';$('note').value=c.note||''}$('modalWrap').classList.remove('hidden');$('title').focus()}
      function closeForm(){$('modalWrap').classList.add('hidden')}
      function notify(message){$('toast').textContent=message;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2300)}
      $('addBtn').onclick=()=>openForm();$('closeBtn').onclick=$('cancelBtn').onclick=closeForm;$('modalWrap').addEventListener('click',e=>{if(e.target===$('modalWrap'))closeForm()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeForm()});
      $('caseForm').onsubmit=e=>{e.preventDefault();const id=$('caseId').value,old=cases.find(c=>c.id===id),now=new Date().toISOString();const item={id:id||crypto.randomUUID(),title:$('title').value.trim(),number:$('number').value.trim(),person:$('person').value.trim(),status:$('status').value,dueDate:$('dueDate').value,note:$('note').value.trim(),createdAt:old?.createdAt||now,updatedAt:now};if(old)cases=cases.map(c=>c.id===id?item:c);else cases.unshift(item);save();render();closeForm();notify(old?'案件已更新':'案件已新增')};
      $('cards').onclick=e=>{const btn=e.target.closest('.edit');if(btn){const c=cases.find(x=>x.id===btn.dataset.id);if(c)openForm(c)}};
      $('deleteBtn').onclick=()=>{const id=$('caseId').value,c=cases.find(x=>x.id===id);if(c&&confirm(`確定刪除「${c.title}」？此操作無法復原。`)){cases=cases.filter(x=>x.id!==id);save();render();closeForm();notify('案件已刪除')}};
      ['search','statusFilter','sortBy'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));
      $('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),cases},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`案件進度備份_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);notify('備份檔已下載')};
      $('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text()),incoming=Array.isArray(data)?data:data.cases;if(!Array.isArray(incoming)||incoming.some(c=>!c||typeof c.title!=='string'))throw new Error('format');if(!confirm(`將匯入 ${incoming.length} 筆案件並取代目前資料，確定繼續？`))return;cases=incoming.map(c=>({id:c.id||crypto.randomUUID(),title:c.title,number:c.number||'',person:c.person||'',status:statuses.includes(c.status)?c.status:'進行中',dueDate:c.dueDate||'',note:c.note||'',createdAt:c.createdAt||new Date().toISOString(),updatedAt:c.updatedAt||new Date().toISOString()}));save();render();notify(`已匯入 ${cases.length} 筆案件`)}catch{alert('無法讀取備份檔，請確認檔案格式正確。')}finally{e.target.value=''}};
      render();
    })();
  </script>
</body>
</html>
